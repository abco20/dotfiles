name: full-bootstrap

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * 6"

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
        profile:
          - host
          - container
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap
        run: |
          ./scripts/bootstrap-linux.sh \
            --profile "${{ matrix.profile }}"

      - name: Smoke test shared tools
        run: |
          export MISE_SYSTEM_CONFIG_DIR="$HOME/.config/mise-managed"
          export MISE_CONFIG_DIR="$HOME/.config/mise"
          zsh -dfc 'source "$HOME/.zshrc"'
          mise --version
          mise config ls
          mise ls
          mise exec -- chezmoi --version
          mise exec -- starship --version
          mise exec -- rg --version
          mise exec -- fzf --version

      - name: Smoke test host languages
        if: matrix.profile == 'host'
        run: |
          export MISE_SYSTEM_CONFIG_DIR="$HOME/.config/mise-managed"
          export MISE_CONFIG_DIR="$HOME/.config/mise"
          mise exec -- node --version
          mise exec -- bun --version
          mise exec -- python --version
          mise exec -- go version
          mise exec -- rustc --version

  ubuntu-desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap desktop
        run: |
          ./scripts/bootstrap-linux.sh \
            --profile host \
            --desktop

      - name: Check desktop config files
        run: |
          test -f "$HOME/.config/wezterm/wezterm.lua"
          test -f "$HOME/.config/mpv/mpv.conf"
          test ! -e "$HOME/.config/mpv/mpv.config"

      - name: Check WezTerm
        run: |
          command -v wezterm
          wezterm --version

      - name: Check Docker
        run: |
          command -v docker
          docker --version
          docker compose version

      - name: Check HackGen font
        run: |
          find "$HOME/.local/share/fonts" \
            -type f \
            -iname '*HackGen*.ttf' \
            -print \
            -quit |
            grep -q .
          fc-list | grep -i 'HackGen'

      - name: Check Visual Studio Code snap
        run: |
          snap list code

      - name: Check mise configuration
        run: |
          export MISE_SYSTEM_CONFIG_DIR="$HOME/.config/mise-managed"
          export MISE_CONFIG_DIR="$HOME/.config/mise"

          mise --version
          mise config ls
          mise ls

      - name: Check mise shared tools
        run: |
          export MISE_SYSTEM_CONFIG_DIR="$HOME/.config/mise-managed"
          export MISE_CONFIG_DIR="$HOME/.config/mise"

          mise exec -- chezmoi --version
          mise exec -- starship --version
          mise exec -- rg --version

      - name: Check mise host languages
        run: |
          export MISE_SYSTEM_CONFIG_DIR="$HOME/.config/mise-managed"
          export MISE_CONFIG_DIR="$HOME/.config/mise"

          mise exec -- node --version
          mise exec -- python --version
          mise exec -- go version
          mise exec -- rustc --version

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap host and desktop
        run: |
          ./scripts/bootstrap-macos.sh \
            --profile host \
            --desktop \
            --skip-manual-desktop

      - name: Smoke test
        run: |
          export MISE_SYSTEM_CONFIG_DIR="$HOME/.config/mise-managed"
          export MISE_CONFIG_DIR="$HOME/.config/mise"
          test -f "$HOME/.config/mpv/mpv.conf"
          test ! -e "$HOME/.config/mpv/mpv.config"
          zsh -dfc 'source "$HOME/.zshrc"'
          brew list --formula mise
          command -v mise
          mise --version
          mise config ls
          mise ls
          mise exec -- chezmoi --version
          mise exec -- starship --version
          mise exec -- rg --version
          mise exec -- fzf --version
          mise exec -- node --version
          mise exec -- bun --version
          mise exec -- python --version
          mise exec -- go version
          mise exec -- rustc --version

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap host
        shell: pwsh
        run: ./scripts/bootstrap-windows.ps1 -Profile Host

      - name: Smoke test
        shell: pwsh
        run: |
          if (-not (Test-Path $PROFILE.CurrentUserAllHosts)) {
              throw "PowerShell profile was not created: $($PROFILE.CurrentUserAllHosts)"
          }
          . $PROFILE.CurrentUserAllHosts
          $Expected = Join-Path $HOME '.config/mise-managed'
          if ($env:MISE_SYSTEM_CONFIG_DIR -ne $Expected) {
              throw 'PowerShell profile did not preserve mise system config.'
          }
          $ExpectedUser = Join-Path $HOME '.config/mise'
          if ($env:MISE_CONFIG_DIR -ne $ExpectedUser) {
              throw 'PowerShell profile did not preserve mise user config.'
          }
          if (Get-Command sheldon -ErrorAction SilentlyContinue) {
              throw 'Sheldon must not be installed on Windows.'
          }
          mise --version
          mise config ls
          mise ls
          mise exec -- chezmoi --version
          mise exec -- starship --version
          mise exec -- rg --version
          if ((Get-Alias ls).Definition -ne 'lsd') {
              throw 'ls alias is incorrect.'
          }
          if ((Get-Alias cat).Definition -ne 'bat') {
              throw 'cat alias is incorrect.'
          }
          if ((Get-Alias vi).Definition -ne 'nvim') {
              throw 'vi alias is incorrect.'
          }
