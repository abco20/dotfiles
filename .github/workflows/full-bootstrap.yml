name: full-bootstrap

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * 6"

jobs:
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
        profile:
          - host
          - container
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap
        run: |
          ./scripts/bootstrap-linux.sh \
            --profile "${{ matrix.profile }}"

      - name: Smoke test shared tools
        run: |
          export MISE_SYSTEM_CONFIG_DIR="$HOME/.config/mise-managed"
          zsh -dfc 'source "$HOME/.zshrc"'
          mise --version
          mise config ls
          mise ls
          mise exec -- chezmoi --version
          mise exec -- starship --version
          mise exec -- rg --version
          mise exec -- fzf --version

      - name: Smoke test host languages
        if: matrix.profile == 'host'
        run: |
          export MISE_SYSTEM_CONFIG_DIR="$HOME/.config/mise-managed"
          mise exec -- node --version
          mise exec -- bun --version
          mise exec -- python --version
          mise exec -- go version
          mise exec -- rustc --version

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap host and desktop
        run: ./scripts/bootstrap-macos.sh --profile host --desktop

      - name: Smoke test
        run: |
          export MISE_SYSTEM_CONFIG_DIR="$HOME/.config/mise-managed"
          test -f "$HOME/.config/mpv/mpv.conf"
          test ! -e "$HOME/.config/mpv/mpv.config"
          zsh -dfc 'source "$HOME/.zshrc"'
          mise --version
          mise config ls
          mise ls
          mise exec -- chezmoi --version
          mise exec -- starship --version
          mise exec -- rg --version
          mise exec -- fzf --version
          mise exec -- node --version
          mise exec -- bun --version
          mise exec -- python --version
          mise exec -- go version
          mise exec -- rustc --version

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap host and desktop
        shell: pwsh
        run: ./scripts/bootstrap-windows.ps1 -Profile Host -Desktop

      - name: Smoke test
        shell: pwsh
        run: |
          . $PROFILE.CurrentUserAllHosts
          $Expected = Join-Path $HOME '.config/mise-managed'
          if ($env:MISE_SYSTEM_CONFIG_DIR -ne $Expected) {
              throw 'PowerShell profile did not preserve mise system config.'
          }
          if (Get-Command sheldon -ErrorAction SilentlyContinue) {
              throw 'Sheldon must not be installed on Windows.'
          }
          mise --version
          mise config ls
          mise ls
          mise exec -- chezmoi --version
          mise exec -- starship --version
          mise exec -- rg --version
          if ((Get-Alias ls).Definition -ne 'lsd') {
              throw 'ls alias is incorrect.'
          }
          if ((Get-Alias cat).Definition -ne 'bat') {
              throw 'cat alias is incorrect.'
          }
          if ((Get-Alias vi).Definition -ne 'nvim') {
              throw 'vi alias is incorrect.'
          }
