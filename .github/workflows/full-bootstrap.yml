name: full-bootstrap

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * 6"

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
        profile:
          - host
          - container
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap
        run: |
          ./scripts/bootstrap-linux.sh \
            --profile "${{ matrix.profile }}"

      - name: Smoke test shared tools
        run: |
          export MISE_SYSTEM_CONFIG_DIR="$HOME/.config/mise-managed"
          export MISE_CONFIG_DIR="$HOME/.config/mise"
          zsh -dfc 'source "$HOME/.zshrc"'
          mise --version
          mise config ls
          mise ls
          mise exec -- chezmoi --version
          mise exec -- starship --version
          mise exec -- rg --version
          mise exec -- fzf --version

      - name: Smoke test host languages
        if: matrix.profile == 'host'
        run: |
          export MISE_SYSTEM_CONFIG_DIR="$HOME/.config/mise-managed"
          export MISE_CONFIG_DIR="$HOME/.config/mise"
          mise exec -- node --version
          mise exec -- bun --version
          mise exec -- python --version
          mise exec -- go version
          mise exec -- rustc --version

  ubuntu-desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap desktop
        run: |
          ./scripts/bootstrap-linux.sh \
            --profile host \
            --desktop

      - name: Check desktop config files
        run: |
          test -f "$HOME/.config/wezterm/wezterm.lua"
          test -f "$HOME/.config/mpv/mpv.conf"
          test ! -e "$HOME/.config/mpv/mpv.config"

      - name: Check WezTerm
        run: |
          command -v wezterm
          wezterm --version

      - name: Check Docker
        run: |
          command -v docker
          docker --version
          docker compose version

      - name: Check HackGen font
        run: |
          find "$HOME/.local/share/fonts" \
            -type f \
            -iname '*HackGen*.ttf' \
            -print \
            -quit |
            grep -q .
          fc-list | grep -i 'HackGen'

      - name: Check Visual Studio Code snap
        run: |
          snap list code

      - name: Check mise configuration
        run: |
          export MISE_SYSTEM_CONFIG_DIR="$HOME/.config/mise-managed"
          export MISE_CONFIG_DIR="$HOME/.config/mise"

          mise --version
          mise config ls
          mise ls

      - name: Check mise shared tools
        run: |
          export MISE_SYSTEM_CONFIG_DIR="$HOME/.config/mise-managed"
          export MISE_CONFIG_DIR="$HOME/.config/mise"

          mise exec -- chezmoi --version
          mise exec -- starship --version
          mise exec -- rg --version

      - name: Check mise host languages
        run: |
          export MISE_SYSTEM_CONFIG_DIR="$HOME/.config/mise-managed"
          export MISE_CONFIG_DIR="$HOME/.config/mise"

          mise exec -- node --version
          mise exec -- python --version
          mise exec -- go version
          mise exec -- rustc --version

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Validate macOS desktop casks
        run: |
          while IFS= read -r cask; do
            brew info --cask "$cask" >/dev/null
          done < <(
            brew bundle list \
              --file packages/macos/Brewfile.desktop \
              --cask
          )

          while IFS= read -r cask; do
            brew info --cask "$cask" >/dev/null
          done < <(
            brew bundle list \
              --file packages/macos/Brewfile.desktop-manual \
              --cask
          )

      - name: Bootstrap host and desktop
        env:
          PS4: '+ ${BASH_SOURCE}:${LINENO}: '
        run: |
          bash -x ./scripts/bootstrap-macos.sh \
            --profile host \
            --desktop \
            --skip-manual-desktop

      - name: Smoke test
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export MISE_SYSTEM_CONFIG_DIR="$HOME/.config/mise-managed"
          export MISE_CONFIG_DIR="$HOME/.config/mise"
          test -x "$HOME/.local/bin/mise"
          test -f "$HOME/.config/wezterm/wezterm.lua"
          test -f "$HOME/.config/mpv/mpv.conf"
          test ! -e "$HOME/.config/mpv/mpv.config"
          zsh -dfc 'source "$HOME/.zshrc"'
          mise --version
          mise config ls --no-header |
            tee "$RUNNER_TEMP/mise-config.txt"
          grep -Fq \
            '.config/mise-managed/conf.d/10-common.toml' \
            "$RUNNER_TEMP/mise-config.txt"
          mise ls
          mise exec aqua:twpayne/chezmoi@2.71.0 -- \
            chezmoi --version
          mise exec -- starship --version
          mise exec -- rg --version
          mise exec -- fzf --version
          mise exec -- node --version
          mise exec -- bun --version
          mise exec -- python --version
          mise exec -- go version
          mise exec -- rustc --version

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap host
        shell: pwsh
        run: |
          ./scripts/bootstrap-windows.ps1 -Profile Host

          $MiseCommand = Get-Command mise -ErrorAction Stop
          $MiseDirectory = Split-Path -Parent $MiseCommand.Source

          $MiseDirectory |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          Write-Host "Persisted mise directory: $MiseDirectory"

      - name: Check Windows profile
        shell: pwsh
        run: |
          if (-not (Test-Path $PROFILE.CurrentUserAllHosts)) {
              $ProfilePath = $PROFILE.CurrentUserAllHosts
              throw "PowerShell profile was not created: $ProfilePath"
          }

          . $PROFILE.CurrentUserAllHosts

          $ExpectedSystem = Join-Path $HOME '.config/mise-managed'
          if ($env:MISE_SYSTEM_CONFIG_DIR -ne $ExpectedSystem) {
              throw 'PowerShell profile did not preserve mise system config.'
          }

          $ExpectedUser = Join-Path $HOME '.config/mise'
          if ($env:MISE_CONFIG_DIR -ne $ExpectedUser) {
              throw 'PowerShell profile did not preserve mise user config.'
          }

          if (Get-Command sheldon -ErrorAction SilentlyContinue) {
              throw 'Sheldon must not be installed on Windows.'
          }

      - name: Check Windows mise
        shell: pwsh
        run: |
          . $PROFILE.CurrentUserAllHosts

          $MiseCommand = Get-Command mise -ErrorAction Stop
          Write-Host "mise executable: $($MiseCommand.Source)"

          mise --version
          $LoadedConfigs = mise config ls --no-header | Out-String
          if ($LASTEXITCODE -ne 0) {
              throw "mise config ls failed with exit code $LASTEXITCODE."
          }

          if ($LoadedConfigs -notmatch
              '\.config[\\/]mise-managed[\\/]conf\.d[\\/]10-common\.toml') {
              throw 'Managed mise common config is not loaded.'
          }

          mise ls

      - name: Check Windows mise-managed tools
        shell: pwsh
        run: |
          . $PROFILE.CurrentUserAllHosts

          function Invoke-MiseManagedCommand {
              param(
                  [Parameter(Mandatory)]
                  [string]$Name,

                  [Parameter(Mandatory)]
                  [string[]]$Arguments
              )

              $WhichOutput = & mise which $Name 2>&1
              $WhichExitCode = $LASTEXITCODE
              $Executable = ($WhichOutput | Out-String).Trim()

              if ($WhichExitCode -ne 0 -or
                  [string]::IsNullOrWhiteSpace($Executable)) {
                  Write-Host "mise which output for ${Name}:"
                  Write-Host $WhichOutput
                  throw "mise could not resolve ${Name}."
              }

              if (-not (Test-Path -LiteralPath $Executable)) {
                  throw "Resolved executable does not exist: $Executable"
              }

              Write-Host "::group::Check $Name"
              Write-Host "Executable: $Executable"

              & $Executable @Arguments
              $CommandExitCode = $LASTEXITCODE

              Write-Host '::endgroup::'

              if ($CommandExitCode -ne 0) {
                  throw "${Name} failed with exit code ${CommandExitCode}."
              }
          }

          $Checks = @(
              @{
                  Name = 'chezmoi'
                  Arguments = @('--version')
              },
              @{
                  Name = 'starship'
                  Arguments = @('--version')
              },
              @{
                  Name = 'rg'
                  Arguments = @('--version')
              },
              @{
                  Name = 'lsd'
                  Arguments = @('--version')
              },
              @{
                  Name = 'bat'
                  Arguments = @('--version')
              },
              @{
                  Name = 'nvim'
                  Arguments = @('--version')
              }
          )

          foreach ($Check in $Checks) {
              Invoke-MiseManagedCommand `
                  -Name $Check.Name `
                  -Arguments $Check.Arguments
          }

      - name: Check Windows aliases
        shell: pwsh
        run: |
          . $PROFILE.CurrentUserAllHosts

          if ((Get-Alias ls -ErrorAction Stop).Definition -ne 'lsd') {
              throw 'ls alias is incorrect.'
          }

          if ((Get-Alias cat -ErrorAction Stop).Definition -ne 'bat') {
              throw 'cat alias is incorrect.'
          }

          if ((Get-Alias vi -ErrorAction Stop).Definition -ne 'nvim') {
              throw 'vi alias is incorrect.'
          }
