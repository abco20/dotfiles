name: ci

on:
  pull_request:
  push:

jobs:
  ubuntu:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        profile: [container, host]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install mise and zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y extrepo zsh
          sudo extrepo enable mise
          sudo apt-get update
          sudo apt-get install -y mise
      - name: Render and test
        env:
          DOTFILES_PROFILE: ${{ matrix.profile }}
          DOTFILES_DESKTOP: "false"
          DOTFILES_ROBOTICS: "false"
        run: |
          export MISE_SYSTEM_CONFIG_DIR="$HOME/.config/mise-managed"
          mise x aqua:twpayne/chezmoi@latest -- \
            chezmoi init --apply --source "$GITHUB_WORKSPACE"
          mise install --locked
          mise config ls | grep -q '.config/mise-managed/conf.d/10-common.toml'
          mise exec -- "$GITHUB_WORKSPACE/tests/test-posix.sh"

      - name: Test system and user lock isolation
        if: matrix.os == 'ubuntu-24.04' && matrix.profile == 'container'
        run: |
          export MISE_SYSTEM_CONFIG_DIR="$HOME/.config/mise-managed"
          mise use -g deno@latest --yes
          mise lock --global --platform linux-x64 --yes
          grep -Fq 'aqua:starship/starship' \
            "$MISE_SYSTEM_CONFIG_DIR/mise.lock"
          ! grep -Fq '[[tools.deno]]' \
            "$MISE_SYSTEM_CONFIG_DIR/mise.lock"
          grep -Fq '[[tools.deno]]' "$HOME/.config/mise/mise.lock"
          ! grep -Fq 'aqua:starship/starship' \
            "$HOME/.config/mise/mise.lock"
          local_config_before=$(sha256sum "$HOME/.config/mise/config.toml")
          local_lock_before=$(sha256sum "$HOME/.config/mise/mise.lock")
          mise exec -- chezmoi apply
          test "$local_config_before" = \
            "$(sha256sum "$HOME/.config/mise/config.toml")"
          test "$local_lock_before" = \
            "$(sha256sum "$HOME/.config/mise/mise.lock")"
          mise install --locked

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./tests/test-windows.ps1
