name: update-mise-locks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 17 * * 5"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install mise and chezmoi
        run: |
          sudo apt-get update
          sudo apt-get install -y extrepo
          sudo extrepo enable mise
          sudo apt-get update
          sudo apt-get install -y mise
          mise x aqua:twpayne/chezmoi@latest -- chezmoi init --apply --source "$GITHUB_WORKSPACE"
      - name: Refresh lockfile
        run: |
          mise lock --global --platform linux-x64,macos-arm64,windows-x64 --yes
          cp "$HOME/.config/mise/mise.lock" home/private_dot_config/mise/mise.lock
          mise install --locked
      - name: Open update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet && exit 0
          branch=automation/mise-lock-update
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -C "$branch"
          git add home/private_dot_config/mise/mise.lock
          git commit -m "chore: update mise lockfile"
          git push --force-with-lease origin "$branch"
          gh pr view "$branch" >/dev/null 2>&1 || gh pr create --base main --head "$branch" --title "chore: update mise lockfile" --body "Automated weekly mise lock refresh."
