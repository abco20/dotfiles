name: update-mise-locks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 17 * * 5"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install mise and chezmoi
        env:
          DOTFILES_PROFILE: host
          DOTFILES_DESKTOP: "false"
          DOTFILES_ROBOTICS: "false"
        run: |
          sudo apt-get update
          sudo apt-get install -y extrepo
          sudo extrepo enable mise
          sudo apt-get update
          sudo apt-get install -y mise
          export MISE_SYSTEM_CONFIG_DIR="$HOME/.config/mise-managed"
          mise x aqua:twpayne/chezmoi@latest -- \
            chezmoi init --apply --source "$GITHUB_WORKSPACE"
      - name: Refresh lockfile
        run: |
          export MISE_SYSTEM_CONFIG_DIR="$HOME/.config/mise-managed"
          local_config="$HOME/.config/mise/config.toml"
          local_lock="$HOME/.config/mise/mise.lock"
          local_config_before=$(sha256sum "$local_config")
          local_lock_before=$(sha256sum "$local_lock")
          mise lock --global \
            --platform linux-x64,macos-arm64,windows-x64 \
            --yes
          cp "$MISE_SYSTEM_CONFIG_DIR/mise.lock" \
            home/private_dot_config/mise-managed/mise.lock
          mise install --locked
          test "$local_config_before" = "$(sha256sum "$local_config")"
          test "$local_lock_before" = "$(sha256sum "$local_lock")"
      - name: Open update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet && exit 0
          branch=automation/mise-lock-update
          git config user.name github-actions[bot]
          git config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin \
            "$branch:refs/remotes/origin/$branch" ||
            true
          git switch -C "$branch"
          git add home/private_dot_config/mise-managed/mise.lock
          git commit -m "chore: update mise lockfile"
          git push --force-with-lease origin "HEAD:$branch"
          gh pr view "$branch" >/dev/null 2>&1 ||
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: update mise lockfile" \
              --body "Automated weekly mise lock refresh."
